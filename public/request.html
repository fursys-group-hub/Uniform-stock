<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LETUS 시공팀 유니폼 실시간 재고 현황</title>
<style>
  :root{
    --green:#22c55e; --green-deep:#16a34a; --green-soft:#dcfce7; --green-mint:#86efac;
    --green-line:#bbf7d0; --green-bg:#f0fdf4;
    --bg:#eef2f0; --surface:#ffffff; --text:#0f2419; --muted:#64748b;
    --line:#e2e8f0; --danger:#dc2626; --danger-soft:#fee2e2;
    --warn:#ea580c; --warn-soft:#ffedd5;
    --shadow:0 10px 30px rgba(16,64,40,.10);
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{
    margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 100% -10%, #d1fae5 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #bbf7d0 0%, transparent 50%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  /* ================= 진입 비밀번호 게이트 ================= */
  .gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#0f2419,#14532d)}
  .gate-card{background:#fff;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);padding:38px 30px;width:100%;max-width:380px;text-align:center}
  .gate-ico{font-size:44px;margin-bottom:10px}
  .gate-card h2{margin:0 0 6px;font-size:20px;color:var(--green-deep)}
  .gate-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .gate-card input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:13px;font-size:20px;text-align:center;letter-spacing:6px;margin-bottom:14px;font-family:inherit}
  .gate-card input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .gate-err{color:var(--danger);font-size:13px;min-height:18px;font-weight:600;margin-top:8px}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  /* ================= 페이지 레이아웃 ================= */
  .wrap{max-width:1400px;margin:0 auto;padding:20px 22px 46px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .topbar h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;color:var(--green-deep);display:flex;align-items:center;gap:10px}
  .topbar .meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
  .live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--green-deep)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
  .live.off{color:var(--danger)}.live.off .dot{background:var(--danger);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

  /* 요약 카드 */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:720px){.summary{grid-template-columns:1fr}}
  .card{border:1.5px solid var(--green-line);background:var(--green-bg);border-radius:16px;padding:16px 18px;transition:transform .15s,box-shadow .15s}
  .card .lab{font-size:13px;color:var(--green-deep);font-weight:700;display:flex;align-items:center;gap:6px}
  .card .val{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .card .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
  .card.alert{border-color:#fecaca;background:#fff5f5}.card.alert .lab{color:var(--danger)}
  .card.clickable{cursor:pointer}
  .card.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,64,40,.12)}
  .card.active{outline:3px solid var(--green-mint);outline-offset:1px}

  /* 컨트롤(필터/검색) */
  .controls{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  @media(max-width:720px){.filters{grid-template-columns:1fr}}
  select,.search{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:#fff;color:var(--text);appearance:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
  select:focus,.search:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .select-wrap{position:relative}
  .select-wrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
  .search-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search-row .search{flex:1;min-width:220px}
  .chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;padding:8px 4px}
  .chk input{width:18px;height:18px;accent-color:var(--green-deep)}

  /* 메인 2단: 재고 표(넓게) + 요청 사이드바 */
  .main{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
  @media(max-width:1000px){.main{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;color:var(--green-deep);display:flex;align-items:center;gap:8px}

  .table-wrap{max-height:calc(100vh - 300px);overflow-y:auto}
  @media(max-width:1000px){.table-wrap{max-height:60vh}}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:#f1f7f3;color:var(--green-deep);font-size:12.5px;font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--green-line);z-index:2}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.act,td.act{text-align:center}
  tbody td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--green-bg)}
  .qty{font-weight:800;font-size:16px}
  .qty.ok{color:var(--green-deep)}.qty.low{color:var(--warn)}.qty.zero{color:var(--danger)}
  .badge{font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
  .b-ok{background:var(--green-soft);color:var(--green-deep)}
  .b-low{background:var(--warn-soft);color:var(--warn)}
  .b-zero{background:var(--danger-soft);color:var(--danger)}
  .add-btn{border:1.5px solid var(--green-line);background:#fff;color:var(--green-deep);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;font-family:inherit}
  .add-btn:hover:not(:disabled){background:var(--green);color:#fff;border-color:var(--green)}
  .add-btn:disabled{opacity:.4;cursor:not-allowed}
  .add-btn.in{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}

  /* 요청 사이드바 */
  .cart-panel{position:sticky;top:16px}
  .cart-body{padding:16px 18px}
  .count-pill{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--green-deep);color:#fff;font-size:12px;font-weight:800;margin-left:auto}
  .req-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:34vh;overflow-y:auto}
  .req-item{display:flex;align-items:center;gap:10px;background:var(--green-bg);border:1px solid var(--green-line);border-radius:11px;padding:9px 10px}
  .req-item .name{flex:1;font-size:13.5px;font-weight:700}
  .req-item .name span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .stepper button{width:30px;height:30px;border:none;background:#f8fafc;color:var(--green-deep);font-size:16px;cursor:pointer;font-weight:700}
  .stepper button:hover{background:var(--green-soft)}
  .stepper input{width:42px;height:30px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:14px;font-weight:700;color:var(--text)}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .rm{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 2px}.rm:hover{color:var(--danger)}
  .req-form{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
  .req-form input,.req-form select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit}
  .req-form input:focus,.req-form select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .req-help{font-size:12.5px;color:var(--green-deep);background:var(--green-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
  .btn-primary{width:100%;background:linear-gradient(135deg,var(--green) 0%,var(--green-deep) 100%);color:#fff;border:none;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(22,163,74,.3);transition:transform .12s;font-family:inherit}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{width:100%;background:#fff;border:1.5px solid var(--green-line);color:var(--green-deep);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-ghost:hover{background:var(--green-soft)}

  /* 가격 패널 */
  .price-panel{margin-top:18px}
  .price-body{padding:16px 18px}
  .lock{text-align:center;max-width:420px;margin:6px auto;padding:8px}
  .lock p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
  .lock-row{display:flex;gap:10px;max-width:360px;margin:0 auto}
  .lock-input{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;text-align:center;font-family:inherit}
  .lock-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .lock-btn{border:none;background:var(--green-deep);color:#fff;border-radius:12px;padding:0 20px;font-weight:800;cursor:pointer;font-family:inherit}
  .lock-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;font-weight:600}
  .price-note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.5}
  .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:900px){.price-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:620px){.price-grid{grid-template-columns:1fr}}
  .price-card{border:1.5px solid var(--green-line);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .price-card.wide{grid-column:1 / -1}
  .pc-head{background:var(--green-bg);color:var(--green-deep);font-weight:800;font-size:12.5px;padding:9px 14px;display:flex;align-items:center;gap:6px}
  .pc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .pc-row:last-child{border-bottom:none}
  .pc-name{font-size:13.5px;font-weight:600}
  .pc-price{font-size:17px;font-weight:800;color:var(--green-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pc-price em{font-size:12px;font-weight:700;color:var(--muted);font-style:normal;margin-left:2px}
  .pc-price.none{font-size:13px;font-weight:700;color:#cbd5e1}
  .price-sum{display:flex;justify-content:center;padding:14px 4px 2px;font-size:13px}

  .foot{margin-top:20px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--green-deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .25s;z-index:150;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ===== 진입 비밀번호 게이트 ===== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-ico">🔒</div>
    <h2>👕 LETUS 시공팀 유니폼 재고</h2>
    <p>접속 비밀번호를 입력해주세요.</p>
    <input id="gatePw" type="password" inputmode="numeric" placeholder="••••" autocomplete="off" maxlength="8" />
    <button class="btn-primary" onclick="enterGate()">입장</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- ===== 대시보드 (페이지형) ===== -->
<div class="wrap" id="app" style="display:none">
  <div class="topbar">
    <h1>👕 LETUS 시공팀 유니폼 실시간 재고 현황</h1>
    <div class="meta">
      <span>⏱ 마지막 업데이트: <b id="updatedAt">불러오는 중…</b></span>
      <span class="live" id="liveTag"><span class="dot"></span> 실시간 연동 중</span>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="controls">
    <div class="filters">
      <div class="select-wrap"><select id="fCat"><option value="">분류 전체</option></select></div>
      <div class="select-wrap"><select id="fItem"><option value="">품목 전체</option></select></div>
      <div class="select-wrap"><select id="fSize"><option value="">사이즈 전체</option></select></div>
    </div>
    <div class="search-row">
      <input type="text" id="search" class="search" placeholder="🔍 검색 (예: 동계 셔츠, 105, ㄷㄱ)" autocomplete="off" />
      <label class="chk"><input type="checkbox" id="onlyStock" /> 재고 있는 품목만</label>
    </div>
  </div>

  <div class="main">
    <!-- 재고 표 -->
    <div class="panel">
      <div class="panel-head">📦 재고 현황</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>분류</th><th>품목</th><th>사이즈</th><th class="num">현재 재고</th><th>상태</th><th class="act">요청</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 요청 사이드바 -->
    <div class="panel cart-panel">
      <div class="panel-head">🧺 요청 목록 <span class="count-pill" id="cartCount" style="display:none">0</span></div>
      <div class="cart-body">
        <div class="req-list" id="reqList"></div>
        <div class="req-form">
          <input type="text" id="reqName" placeholder="요청자 이름 (예: 홍길동)" />
          <input type="text" id="reqRegion" placeholder="요청 권역 (예: SA 권역)" />
          <div class="select-wrap">
            <select id="reqCenter">
              <option value="">받으실 센터를 선택하세요</option>
              <option>양지센터(9층 물류창고 벤치 위)</option>
              <option>양지센터(직접 수령)</option>
              <option>부산센터</option>
              <option>대구센터</option>
              <option>대전센터</option>
              <option>광주센터</option>
              <option>전북센터</option>
              <option>전남센터</option>
              <option>제주센터</option>
              <option>울산센터</option>
              <option>창원센터</option>
              <option>기장센터</option>
            </select>
          </div>
        </div>
        <div class="req-help">🚚 유니폼은 선택하신 <b>센터로 가는 간선차량</b>에 태웁니다.</div>
        <button class="btn-primary" onclick="sendRequest()">📨 본사 담당자에게 요청 보내기</button>
      </div>
    </div>
  </div>

  <!-- 가격 확인 패널 -->
  <div class="panel price-panel">
    <div class="panel-head">💰 품목별 단가 확인</div>
    <div class="price-body">
      <div id="priceLock" class="lock">
        <p>단가는 비밀번호 확인 후 볼 수 있습니다.</p>
        <div class="lock-row">
          <input type="password" id="pricePw" class="lock-input" placeholder="비밀번호" autocomplete="off" />
          <button class="lock-btn" onclick="unlockPrice()">🔓 확인</button>
        </div>
        <div class="lock-err" id="priceErr"></div>
      </div>
      <div id="priceContent" class="hidden">
        <div class="price-note">💰 <b>유니폼 품목별 단가</b> · 본사 관리자 시스템 등록값과 실시간 연동됩니다.</div>
        <div id="priceGrid" class="price-grid"></div>
        <div class="price-sum" id="priceSum"></div>
      </div>
    </div>
  </div>

  <div class="foot">
    본 화면은 <b>조회·요청 전용</b>입니다 · 재고 등록·수정은 본사 관리자 시스템에서 처리됩니다
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   설정
   ========================================================================= */
const CONFIG = {
  API_BASE: '',                          // 같은 서버에서 서빙 → 비움
  HQ_EMAIL: 'yousun_jeong@fursys.com',
  HQ_NAME: '본사 유니폼 담당자',
  GATE_PASSWORD: '1593',                 // 진입(장난 방지용) 비밀번호 — 실제 보안 아님
  LOW_THRESHOLD: 10,
  REFRESH_MS: 30000
};

const SIZE_SETS = {
  '유니폼 상의': ['90','95','100','105','110','115','120'],
  '유니폼 하의': ['28','30','32','34','36','38','40','42']
};
const PRICE_ORDER = [
  ['유니폼 상의', ['조끼','하계 셔츠','동계내피(이너패딩)','동계 셔츠','동계외피(춘추아우터)']],
  ['유니폼 하의', ['하계 바지','동계 바지']],
  ['장갑',        ['장갑']],
  ['시공매트',    ['시공매트']]
];
const SEED = [
  {category:'유니폼 상의',name:'조끼',size:'95',stock:5},{category:'유니폼 상의',name:'조끼',size:'105',stock:38},
  {category:'유니폼 상의',name:'조끼',size:'110',stock:50},{category:'유니폼 상의',name:'조끼',size:'115',stock:60},
  {category:'유니폼 상의',name:'조끼',size:'120',stock:1},{category:'유니폼 상의',name:'하계 셔츠',size:'90',stock:14},
  {category:'유니폼 상의',name:'하계 셔츠',size:'95',stock:38},{category:'유니폼 상의',name:'하계 셔츠',size:'105',stock:44},
  {category:'유니폼 상의',name:'하계 셔츠',size:'110',stock:44},{category:'유니폼 상의',name:'하계 셔츠',size:'115',stock:13},
  {category:'유니폼 상의',name:'하계 셔츠',size:'120',stock:2},{category:'유니폼 상의',name:'동계 셔츠',size:'90',stock:21},
  {category:'유니폼 상의',name:'동계 셔츠',size:'95',stock:108},{category:'유니폼 상의',name:'동계 셔츠',size:'100',stock:68},
  {category:'유니폼 상의',name:'동계 셔츠',size:'105',stock:57},{category:'유니폼 상의',name:'동계 셔츠',size:'110',stock:100},

let ROWS = [], cart = new Map(), onlyAlert = false, PRICEMAP = null, PRICE_PW = null;
const $ = (id)=>document.getElementById(id);
const fmt = (n)=>Number(n||0).toLocaleString('ko-KR');
const keyOf = (r)=>`${r.category}|${r.name}|${r.size}`;

/* 초성 검색 */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(str){let out='';for(const ch of str){const c=ch.charCodeAt(0)-0xAC00;if(c>=0&&c<11172)out+=CHO[Math.floor(c/588)];else out+=ch;}return out;}

/* ===== 진입 게이트 ===== */
function enterGate(){
  if($('gatePw').value.trim()===CONFIG.GATE_PASSWORD){
    sessionStorage.setItem('letus_gate','1');
    startApp();
  }else{
    $('gateErr').textContent='비밀번호가 올바르지 않습니다.';
    const c=document.querySelector('.gate-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
    $('gatePw').select();
  }
}
function startApp(){
  $('gate').classList.add('hidden');
  $('app').style.display='';
  renderCart();
  load();
  setInterval(load, CONFIG.REFRESH_MS);
}

/* ===== 표준 사이즈 그리드 보정 ===== */
function normalizeGrid(rows){
  const catIdx=new Map(), nameIdx=new Map();
  rows.forEach(r=>{if(!catIdx.has(r.category))catIdx.set(r.category,catIdx.size);const nk=r.category+'|'+r.name;if(!nameIdx.has(nk))nameIdx.set(nk,nameIdx.size);});
  for(const [cat,sizes] of Object.entries(SIZE_SETS)){
    const names=[...new Set(rows.filter(r=>r.category===cat).map(r=>r.name))];
    for(const name of names)for(const size of sizes)
      if(!rows.some(r=>r.category===cat&&r.name===name&&r.size===size)) rows.push({category:cat,name,size,stock:0,price:0});
  }
  const numOf=s=>{const n=parseInt(s,10);return isNaN(n)?9999:n;};
  rows.sort((a,b)=>{const ca=catIdx.get(a.category)??999,cb=catIdx.get(b.category)??999;if(ca!==cb)return ca-cb;
    const na=nameIdx.get(a.category+'|'+a.name)??999,nb=nameIdx.get(b.category+'|'+b.name)??999;if(na!==nb)return na-nb;return numOf(a.size)-numOf(b.size);});
  return rows;
}

/* ===== 데이터 로드 ===== */
async function load(){
  const url=(CONFIG.API_BASE||'')+'/api/stock';
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    ROWS=data.map(r=>({category:r.category,name:r.name,size:r.size,stock:Number(r.currentStock||0),price:0}));
    setLive(true);
  }catch(e){ ROWS=SEED.map(r=>({...r,price:0})); setLive(false); }
  ROWS=normalizeGrid(ROWS);
  ROWS.forEach(r=>r.key=keyOf(r));
  await refreshPrices();               // 잠금 해제 상태면 관리자 최신 단가를 30초 주기로 재조회
  applyPrices();
  stampTime();
  buildCategoryOptions();
  render();
  if(!$('priceContent').classList.contains('hidden')) renderPrice();
}
function applyPrices(){ if(!PRICEMAP) return; ROWS.forEach(r=>{r.price=PRICEMAP[keyOf(r)]||0;}); }
// 잠금 해제 후, 관리자 단가 변경을 켜 둔 화면에도 자동 반영(조용히 재시도, 실패 무시)
async function refreshPrices(){
  if(!PRICE_PW) return;
  try{
    const res=await fetch((CONFIG.API_BASE||'')+'/api/prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PRICE_PW})});
    if(!res.ok) return;
    const data=await res.json();
    PRICEMAP={}; data.forEach(r=>{PRICEMAP[`${r.category}|${r.name}|${r.size}`]=Number(r.unitPrice||0);});
  }catch(e){ /* 네트워크 일시 오류는 다음 주기에 재시도 */ }
}
function setLive(on){const t=$('liveTag');if(on){t.classList.remove('off');t.innerHTML='<span class="dot"></span> 실시간 연동 중';}else{t.classList.add('off');t.innerHTML='<span class="dot"></span> 내장 데이터 표시 중';}}
function stampTime(){const t=new Date(),p=n=>String(n).padStart(2,'0');$('updatedAt').textContent=`${t.getFullYear()}.${p(t.getMonth()+1)}.${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;}
function statusOf(s){if(s<=0)return{qcls:'zero',badge:'<span class="badge b-zero">🔴 품절</span>'};if(s<CONFIG.LOW_THRESHOLD)return{qcls:'low',badge:'<span class="badge b-low">🟠 부족</span>'};return{qcls:'ok',badge:'<span class="badge b-ok">🟢 여유</span>'};}

/* ===== 연계형 드롭다운 ===== */
function buildCategoryOptions(){fill($('fCat'),'분류 전체',[...new Set(ROWS.map(r=>r.category))],$('fCat').value);buildItemOptions();buildSizeOptions();}
function buildItemOptions(){const cat=$('fCat').value;fill($('fItem'),'품목 전체',[...new Set(ROWS.filter(r=>!cat||r.category===cat).map(r=>r.name))],$('fItem').value);}
function buildSizeOptions(){const cat=$('fCat').value,item=$('fItem').value;fill($('fSize'),'사이즈 전체',[...new Set(ROWS.filter(r=>(!cat||r.category===cat)&&(!item||r.name===item)).map(r=>r.size))],$('fSize').value);}
function fill(sel,allLabel,values,keep){const cur=values.includes(keep)?keep:'';sel.innerHTML=`<option value="">${allLabel}</option>`+values.map(v=>`<option value="${v}">${v}</option>`).join('');sel.value=cur;}

/* ===== 렌더 ===== */
function render(){
  const cat=$('fCat').value,item=$('fItem').value,size=$('fSize').value;
  const kw=$('search').value.trim(),kwCho=chosung(kw),onlyStock=$('onlyStock').checked;
  let list=ROWS.filter(r=>{
    if(cat&&r.category!==cat)return false;if(item&&r.name!==item)return false;if(size&&r.size!==size)return false;
    if(onlyStock&&r.stock<=0)return false;if(onlyAlert&&r.stock>=CONFIG.LOW_THRESHOLD)return false;
    if(kw){const hay=`${r.category} ${r.name} ${r.size}`;if(!(hay.includes(kw)||chosung(hay).includes(kwCho)))return false;}
    return true;
  });
  renderSummary(list);
  const tb=$('tbody');
  if(!list.length){tb.innerHTML=`<tr><td colspan="6" class="empty">조건에 맞는 품목이 없습니다.</td></tr>`;return;}
  tb.innerHTML=list.map(r=>{
    const s=statusOf(r.stock),inCart=cart.has(r.key),disabled=r.stock<=0&&!inCart;
    return `<tr><td>${r.category}</td><td>${r.name}</td><td>${r.size}</td>
      <td class="num"><span class="qty ${s.qcls}">${fmt(r.stock)}</span></td><td>${s.badge}</td>
      <td class="act"><button class="add-btn ${inCart?'in':''}" ${disabled?'disabled':''} onclick="addToCart('${encodeURIComponent(r.key)}')">${inCart?'담김 ✓':'＋ 요청'}</button></td></tr>`;
  }).join('');
}
function renderSummary(list){
  const total=list.length,qty=list.reduce((a,r)=>a+Math.max(0,r.stock),0);
  const zero=list.filter(r=>r.stock<=0).length,low=list.filter(r=>r.stock>0&&r.stock<CONFIG.LOW_THRESHOLD).length;
  $('summary').innerHTML=`
    <div class="card"><div class="lab">📦 전체 품목 수</div><div class="val">${fmt(total)}<small>개</small></div></div>
    <div class="card"><div class="lab">👕 총 여유 재고</div><div class="val">${fmt(qty)}<small>벌</small></div></div>
    <div class="card alert clickable ${onlyAlert?'active':''}" onclick="toggleAlertFilter()"><div class="lab">🚨 부족·품절</div><div class="val">${fmt(low+zero)}<small>건 (클릭 필터)</small></div></div>`;
}
function toggleAlertFilter(){onlyAlert=!onlyAlert;render();}

/* ===== 장바구니 ===== */
function addToCart(encKey){
  const key=decodeURIComponent(encKey),row=ROWS.find(r=>r.key===key);if(!row)return;
  if(cart.has(key)){cart.delete(key);toast('요청 목록에서 제외했습니다');}
  else{cart.set(key,{row,qty:1});toast('요청 목록에 담았습니다');}
  renderCart();render();
}
function changeQty(encKey,delta,abs){const it=cart.get(decodeURIComponent(encKey));if(!it)return;if(abs!=null)it.qty=Math.max(1,parseInt(abs,10)||1);else it.qty=Math.max(1,it.qty+delta);renderCart();}
function removeItem(encKey){cart.delete(decodeURIComponent(encKey));renderCart();render();}
function renderCart(){
  const n=cart.size,pill=$('cartCount');pill.style.display=n?'inline-flex':'none';pill.textContent=n;
  const list=$('reqList');
  if(!n){list.innerHTML=`<div style="color:var(--muted);font-size:13px;padding:8px 2px">아직 담은 품목이 없습니다.<br>표에서 <b>＋ 요청</b>을 눌러 담아주세요.</div>`;return;}
  list.innerHTML=[...cart.entries()].map(([key,it])=>{const ek=encodeURIComponent(key);
    return `<div class="req-item"><div class="name">${it.row.name}<span>${it.row.category} · ${it.row.size} (재고 ${fmt(it.row.stock)})</span></div>
      <div class="stepper"><button onclick="changeQty('${ek}',-1)">−</button><input type="number" min="1" value="${it.qty}" onchange="changeQty('${ek}',0,this.value)"/><button onclick="changeQty('${ek}',1)">＋</button></div>
      <button class="rm" onclick="removeItem('${ek}')" title="삭제">✕</button></div>`;
  }).join('');
}

/* ===== 요청 전송 ===== */
function buildRequestText(){
  const name=$('reqName').value.trim()||'(이름 미입력)',region=$('reqRegion').value.trim()||'(권역 미입력)',center=$('reqCenter').value.trim()||'(센터 미선택)';
  const now=new Date(),p=n=>String(n).padStart(2,'0');
  const stamp=`${now.getFullYear()}.${p(now.getMonth()+1)}.${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
  let l=['[시공팀 유니폼 요청]',`요청일시: ${stamp}`,`요청자: ${name}`,`요청 권역: ${region}`,`받으실 센터: ${center}`,'','📦 주문품목','─────────────────────────────'];
  let i=1;for(const [,it] of cart) l.push(`${i++}. ${it.row.name} - ${it.row.size} - ${it.qty}EA (현재고 ${it.row.stock})`);
  l.push('─────────────────────────────');return l.join('\n');
}
function validateCart(){
  if(!cart.size){toast('요청할 품목을 먼저 담아주세요');return false;}
  if(!$('reqCenter').value.trim()){toast('받으실 센터를 선택해주세요');$('reqCenter').focus();return false;}
  return true;
}
async function sendRequest(){
  if(!validateCart())return;
  // 품목 목록만 전송 — "주문품목" 헤더/제목 볼드는 슬랙 템플릿에서 처리
  const items=[...cart.values()].map(it=>`- ${it.row.name} - ${it.row.size} - ${it.qty}EA`).join('\n');
  const payload={requester:$('reqName').value.trim()||'(이름 미입력)',region:$('reqRegion').value.trim()||'(권역 미입력)',center:$('reqCenter').value.trim(),items};
  try{
    const res=await fetch((CONFIG.API_BASE||'')+'/api/uniform-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    toast('본사 담당자 슬랙으로 요청을 보냈습니다 ✅');
    cart.clear();renderCart();render();
  }catch(e){
    toast('전송 실패 — 메일 앱으로 대신 보냅니다');
    const subj=`[시공팀 유니폼 요청] ${payload.region} ${payload.center}`.trim();
    window.location.href=`mailto:${CONFIG.HQ_EMAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(buildRequestText())}`;
  }
}

/* ===== 가격 확인 (서버 검증) ===== */
async function unlockPrice(){
  const pw=$('pricePw').value;
  try{
    const res=await fetch((CONFIG.API_BASE||'')+'/api/prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(!res.ok){
      let code=''; try{ code=(await res.json()).error||''; }catch(_){}
      if(res.status===401) throw new Error('비밀번호가 올바르지 않습니다.');
      if(code==='price-password-missing') throw new Error('서버에 가격 확인 비밀번호가 설정되지 않았습니다. (관리자: 배포 환경변수 PRICE_PASSWORD 설정 필요)');
      throw new Error('서버 오류로 확인하지 못했습니다 ('+res.status+'). 잠시 후 다시 시도하세요.');
    }
    const data=await res.json();PRICEMAP={};data.forEach(r=>{PRICEMAP[`${r.category}|${r.name}|${r.size}`]=Number(r.unitPrice||0);});
    PRICE_PW=pw;                        // 이후 30초 주기 자동 재조회에 사용
    $('priceErr').textContent='';$('pricePw').value='';$('priceLock').classList.add('hidden');$('priceContent').classList.remove('hidden');
    applyPrices();renderPrice();toast('가격 정보를 확인합니다');
  }catch(e){
    $('priceErr').textContent = e.message || '서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.';
    const b=$('priceLock');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('pricePw').select();
  }
}
const CAT_ICON={'유니폼 상의':'👕','유니폼 하의':'👖','장갑':'🧤','시공매트':'🟩'};
function renderPrice(){
  let html='',anyPrice=false;
  for(const [cat,names] of PRICE_ORDER){
    const rows=[];
    for(const name of names){
      const group=ROWS.filter(r=>r.category===cat&&r.name===name);if(!group.length)continue;
      const price=Math.max(0,...group.map(r=>Number(r.price)||0));if(price>0)anyPrice=true;
      const ph=price>0?`<span class="pc-price">${fmt(price)}<em>원</em></span>`:`<span class="pc-price none">미등록</span>`;
      rows.push(`<div class="pc-row"><span class="pc-name">${name}</span>${ph}</div>`);
    }
    if(rows.length)html+=`<div class="price-card"><div class="pc-head">${CAT_ICON[cat]||'•'} ${cat}</div>${rows.join('')}</div>`;
  }
  $('priceGrid').innerHTML=html||`<div class="empty">표시할 품목이 없습니다.</div>`;
  $('priceSum').innerHTML=anyPrice?'':`<span style="color:var(--muted);font-weight:600">단가가 아직 등록되지 않았습니다 · 본사 관리자 시스템에서 단가 입력 시 자동 표시됩니다</span>`;
}

/* ===== 토스트 ===== */
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

/* ===== 이벤트 ===== */
$('fCat').addEventListener('change',()=>{$('fItem').value='';$('fSize').value='';buildItemOptions();buildSizeOptions();render();});
$('fItem').addEventListener('change',()=>{$('fSize').value='';buildSizeOptions();render();});
$('fSize').addEventListener('change',render);
$('search').addEventListener('input',render);
$('onlyStock').addEventListener('change',render);
$('pricePw').addEventListener('keydown',e=>{if(e.key==='Enter')unlockPrice();});
$('gatePw').addEventListener('keydown',e=>{if(e.key==='Enter')enterGate();});

/* ===== 시작: 게이트 통과했는지 확인 ===== */
if(sessionStorage.getItem('letus_gate')==='1'){ startApp(); }
else { setTimeout(()=>$('gatePw').focus(),100); }
