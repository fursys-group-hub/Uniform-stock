<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유니폼 재고 현황</title>
  <style>
    :root{
      --bg:#f5f7fb; --surface:#fff; --text:#0f172a; --muted:#64748b;
      --line:#e2e8f0; --primary:#2563eb; --danger:#dc2626; --warning:#d97706; --success:#16a34a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:900px;margin:0 auto;padding:16px}
    header{position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:5}
    h1{font-size:20px;margin:0 0 4px}
    .sub{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:12px 0}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    @media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .stat span{font-size:12px;color:var(--muted);display:block}
    .stat strong{font-size:18px}
    .cat{font-size:13px;font-weight:700;color:var(--primary);margin:18px 0 6px;padding-left:2px}
    table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{padding:11px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
    th{background:#f1f5f9;color:var(--muted);font-weight:600;font-size:12px}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    tr:last-child td{border-bottom:none}
    .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
    .b-ok{background:#dcfce7;color:var(--success)}
    .b-low{background:#fef3c7;color:var(--warning)}
    .b-zero{background:#fee2e2;color:var(--danger)}
    .empty{text-align:center;color:var(--muted);padding:28px}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>유니폼 재고 현황</h1>
      <div class="sub">
        <span><span class="dot"></span> 실시간 자동 갱신</span>
        <span id="updatedAt">불러오는 중…</span>
      </div>
      <input type="text" id="search" class="search" placeholder="품목·사이즈·분류 검색 (예: 조끼, 105)" />
    </header>

    <div class="stats" id="stats"></div>
    <div id="list"></div>
    <footer>이 화면은 조회 전용입니다 · 등록·수정은 관리자 화면에서 합니다</footer>
  </div>

  <script>
    const REFRESH_MS = 20000;   // 20초마다 자동 갱신
    let rows = [];

    function fmt(n){ return Number(n||0).toLocaleString('ko-KR'); }
    function statusBadge(cur, safety){
      if (cur <= 0) return '<span class="badge b-zero">품절</span>';
      if (safety > 0 && cur <= safety) return '<span class="badge b-low">부족</span>';
      return '<span class="badge b-ok">정상</span>';
    }

    function render(){
      const kw = document.getElementById('search').value.trim();
      const filtered = rows.filter(r => !kw || `${r.category} ${r.name} ${r.size}`.includes(kw));

      const totalQty = filtered.reduce((a,r)=>a+r.currentStock,0);
      const zero = filtered.filter(r=>r.currentStock<=0).length;
      const low = filtered.filter(r=>r.safetyStock>0 && r.currentStock>0 && r.currentStock<=r.safetyStock).length;
      document.getElementById('stats').innerHTML = [
        ['품목 수', fmt(filtered.length)],
        ['총 재고 수량', fmt(totalQty)],
        ['부족', fmt(low)],
        ['품절', fmt(zero)]
      ].map(([l,v])=>`<div class="stat"><span>${l}</span><strong>${v}</strong></div>`).join('');

      if (!filtered.length){ document.getElementById('list').innerHTML = '<div class="empty">표시할 재고가 없습니다.</div>'; return; }

      // 분류별 그룹
      const groups = {};
      for (const r of filtered){ (groups[r.category] ||= []).push(r); }
      let html = '';
      for (const cat of Object.keys(groups)){
        html += `<div class="cat">${cat}</div>`;
        html += '<table><thead><tr><th>품목</th><th>사이즈</th><th class="num">현재고</th><th>상태</th></tr></thead><tbody>';
        html += groups[cat].map(r=>`
          <tr>
            <td>${r.name}</td>
            <td>${r.size}</td>
            <td class="num">${fmt(r.currentStock)}</td>
            <td>${statusBadge(r.currentStock, r.safetyStock)}</td>
          </tr>`).join('');
        html += '</tbody></table>';
      }
      document.getElementById('list').innerHTML = html;
    }

    async function load(){
      try{
        const res = await fetch('/api/stock', { cache:'no-store' });
        if (!res.ok) throw new Error('HTTP '+res.status);
        rows = await res.json();
        const t = new Date();
        document.getElementById('updatedAt').textContent =
          '업데이트 ' + t.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        render();
      }catch(e){
        document.getElementById('updatedAt').textContent = '연결 확인 중…';
      }
    }

    document.getElementById('search').addEventListener('input', render);
    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
