# Render 공개 호스팅 설정 (Blueprint)
# - 우리 Dockerfile(Node + Express)을 그대로 사용해 웹 서비스로 배포한다.
# - 비밀값(DATABASE_URL 등)은 여기 적지 않고 Render 대시보드에서 입력한다(sync:false).
services:
  - type: web
    name: uniform-stock
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                 # 상시 가동이 필요하면 유료(starter)로 올리면 절전(콜드스타트) 없음
    healthCheckPath: /api/health
    envVars:
      - key: DB_SCHEMA
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PRICE_PASSWORD
        sync: false
      - key: SLACK_REQUEST_WEBHOOK
        sync: false
